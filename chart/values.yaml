ingress-nginx:
  controller:
    kind: DaemonSet
    hostNetwork: false
    dnsPolicy: ClusterFirst

    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      fsGroup: 82

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 82
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE

    service:
      enabled: true
      type: LoadBalancer

    admissionWebhooks:
      enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 90Mi
      limits:
        cpu: 500m
        memory: 256Mi

    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

    config:
      use-forwarded-headers: "true"
      client-max-body-size: "50m"
      ssl-redirect: "false"
